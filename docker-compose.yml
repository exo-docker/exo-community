# ===================================================================
# eXo Platform Community Edition - Docker Compose Configuration
# Version: 7.2
#
# WARNING: This configuration is designed for DEMONSTRATION PURPOSES ONLY
#          Not suitable for production environments without modifications
#
# Features included:
# - eXo Platform 7.2.1
# - MySQL 8.4.9 database
# - Elasticsearch 8.18.8 for search
# - ONLYOFFICE Document Server 9.4
# - Matrix (Synapse) messaging server
# - Nginx 1.30 reverse proxy
#
# ===================================================================
# SECURITY NOTICE:
# 1. This configuration uses default credentials that MUST be changed
# 2. SSL/TLS is not configured - HTTPS is strongly recommended
# 3. Database ports are exposed with default passwords
# 4. JWT secrets are hardcoded in this configuration
#
# Before deployment:
# 1. Add 'exoapp.local' to your hosts file (or configure proper DNS)
#    Example: 127.0.0.1 exoapp.local
# 2. Configure firewall rules for ports 80 (HTTP) and 443 (HTTPS)
# 3. Generate proper SSL certificates for production use
# 4. Replace all default passwords and secrets
#
# Production recommendations:
# 1. Use external secret management
# 2. Implement proper backup strategy
# 3. Configure resource limits
# 4. Set up monitoring and logging
# 5. Enable HTTPS with Let's Encrypt or other CA
# ===================================================================

name: "exo-community"
services:
  web:
    image: nginx:1.30.2-alpine
    expose:
      - "80"
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf/matrix/.well-known:/srv/matrix/.well-known:ro
    links:
      - exo
      - onlyoffice
      - matrix
    depends_on:
      - exo
      - onlyoffice
      - matrix
    networks:
      default:     
        aliases:
          - ${EXO_PROXY_VHOST:-exoapp.local}
  exo:
    image: exoplatform/exo-community:7.2.1
    environment:
      EXO_PROXY_VHOST: ${EXO_PROXY_VHOST:-exoapp.local}
      EXO_PROXY_PORT: 80
      EXO_DB_HOST: mysql
      EXO_PROXY_SSL: "false"
      EXO_DB_TYPE: mysql
      EXO_DB_NAME: exo
      EXO_DB_USER: exo
      EXO_DB_PASSWORD: my-secret-pw
      EXO_JVM_LOG_GC_ENABLED: "true"
      EXO_ES_HOST: es
      JAVA_OPTS: >-
        -Donlyoffice.documentserver.host=${EXO_PROXY_VHOST:-exoapp.local}
        -Donlyoffice.documentserver.schema=${EXO_PROXY_SCHEMA:-http}
        -Donlyoffice.documentserver.allowedhosts=localhost,${EXO_PROXY_VHOST:-exoapp.local}
        -Donlyoffice.documentserver.accessOnly=false
        -Donlyoffice.documentserver.secret=${ONLYOFFICE_JWT_SECRET:-d24079cba6ea93aab7a0efcde5143673e8e4cd32be51519112ca604cf4f9bbb6}
        -Dmeeds.matrix.server.url=${EXO_PROXY_SCHEMA:-http}://${EXO_PROXY_VHOST:-exoapp.local}
        -Dmeeds.matrix.server.name=${EXO_PROXY_VHOST:-exoapp.local}
        -Dmeeds.matrix.user.name=${MATRIX_ADMIN_USERNAME:-root}
        -Dmeeds.matrix.shared_secret_registration=${MATRIX_REGISTRATION_SHARED_SECRET:-DxdtEzvKMySMRRATMIzGtbjYos2VE6rs}
        -Dmeeds.matrix.jwt.secret=${MATRIX_JWT_SECRET:-nuNAEOZEeRAeLST2BORgulPm47TUiJFN}
    volumes:
      - exo_data:/srv/exo
      - exo_codec:/etc/exo/codec:rw
      - exo_logs:/var/log/exo
    depends_on:
      - mysql
      - es
      - onlyoffice
      - matrix
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_ROOT_PASSWORD: my-super-secret-pw
      MYSQL_DATABASE: exo
      MYSQL_USER: exo
      MYSQL_PASSWORD: my-secret-pw
    volumes:
      - mysql_data:/var/lib/mysql
  es:
    image: elasticsearch:8.18.8
    volumes:
      - search_data:/usr/share/elasticsearch/data:rw
    environment:
      - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
      - node.name=exo
      - cluster.name=exo
      - cluster.initial_master_nodes=exo
      - network.host=_site_
      - xpack.security.enabled=false
  onlyoffice:
    image: onlyoffice/documentserver:9.4
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-d24079cba6ea93aab7a0efcde5143673e8e4cd32be51519112ca604cf4f9bbb6}
      SECURE_LINK_SECRET: fe6c434c36ee04031718b3c53b1d803739da880a142baf17b8f56dc2520877dd
      ALLOW_PRIVATE_IP_ADDRESS: "true"
  matrix:
    image: matrixdotorg/synapse:v1.144.0
    hostname: matrix
    restart: unless-stopped
    environment:
      MATRIX_SERVER_NAME: ${EXO_PROXY_VHOST:-exoapp.local}
      MATRIX_PUBLIC_BASEURL: ${EXO_PROXY_SCHEMA:-http}://${EXO_PROXY_VHOST:-exoapp.local}
      MATRIX_DB_PASSWORD: ${MATRIX_DB_PASSWORD:-matrix-secret-pw}
      MATRIX_POSTGRES_PASSWORD: ${MATRIX_POSTGRES_PASSWORD:-matrix-super-secret-pw}
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:-DxdtEzvKMySMRRATMIzGtbjYos2VE6rs}
      MATRIX_MACAROON_SECRET: ${MATRIX_MACAROON_SECRET:-rIQ4wzX7jW9R6FsBJAVwUitOpwirDA5aUCLeDxvtIZ4}
      MATRIX_FORM_SECRET: ${MATRIX_FORM_SECRET:-e4JA36Lid9KXhCZji5Fy6M5dw9ByF8cb}
      MATRIX_JWT_SECRET: ${MATRIX_JWT_SECRET:-nuNAEOZEeRAeLST2BORgulPm47TUiJFN}
      MATRIX_ADMIN_USERNAME: ${MATRIX_ADMIN_USERNAME:-root}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD:-7ZiE4tncpXRWjtBRzulzP8O7oBu4nZ2y}
      ENABLE_PLUGIN_INSTALL: "true"
    volumes:
      - ./conf/matrix:/config:ro
      - matrix_data:/data
      - matrix_logs:/var/log/matrix
    entrypoint: ["/bin/bash", "/config/initialize.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MATRIX_POSTGRES_PASSWORD:-matrix-super-secret-pw}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  exo_data:
  exo_codec:
  exo_logs:
  mysql_data:
  search_data:
  matrix_data:
  matrix_logs:
  postgres_data:
